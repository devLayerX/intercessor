name: Sync README to Wiki

on:
  push:
    branches: [main]
    paths: [README.md]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push README to wiki
        uses: nicoulaj/github-markdown-wiki@v1
        with:
          files: README.md
          wiki-page-name: Home
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}